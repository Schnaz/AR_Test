 <!DOCTYPE html>
<html>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <body style="margin : 0px; overflow: hidden;">
        <a-scene embedded arjs>
        <a-assets>
            <a-asset-item id="model1" src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/refs/heads/main/2.0/Avocado/glTF/Avocado.gltf"></a-asset-item>
            <a-asset-item id="model2" src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/refs/heads/main/2.0/AntiqueCamera/glTF/AntiqueCamera.gltf"></a-asset-item>
            <a-asset-item id="model3" src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/refs/heads/main/2.0/BarramundiFish/glTF/BarramundiFish.gltf"></a-asset-item>
            <a-asset-item id="model4" src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/refs/heads/main/2.0/BoomBox/glTF/BoomBox.gltf"></a-asset-item>
        </a-assets>
            <a-marker type='pattern' url='https://raw.githubusercontent.com/Schnaz/AR_Test/refs/heads/main/Test.patt'>
                <a-entity
                position="0 0 0"
                rotation="0 0 0"
                scale="0.5 0.5 0.5"
                gltf-model="#model1"
                ></a-entity>
                <a-image
                src='https://raw.githubusercontent.com/Schnaz/AR_Test/refs/heads/main/pattern-Test.png'
                position="0 0 0"
                rotation="-90 0 0"
                width="1"
                height="1">
                </a-image>

            </a-marker>
            <a-entity camera></a-entity>
        </a-scene>

        <script>
            let modelop = 1;
            let modelops = ["model1", "model2", "model3", "model4"]
  
            const modelEntity = document.querySelector('a-entity');

            document.addEventListener('keydown', function(event) {
                if (event.code === 'ArrowLeft') {
                    if (modelop>1) modelop-=1;
                    modelEntity.setAttribute('gltf-model', "#model" + String(modelop));
                }
            });
            document.addEventListener('keydown', function(event) {
                if (event.code === 'ArrowRight') {
                    if (modelop<4) modelop+=1;
                    modelEntity.setAttribute('gltf-model', "#model" + String(modelop));
                }
            });
        </script>
    </body>
</html>
