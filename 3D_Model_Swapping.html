<!DOCTYPE html>
<html>

<style>
/* Banner styles */

.dropdown {
  position: relative;
  display: inline-block;
}

.slide-banner {
	background-color: #2563eb;
	color: #ffffff;
	padding: 10px 20px;
	font-family: sans-serif;
	height: 50px;
	display: flex;
	gap: 5px;
}

.slide-switch {
	background-color: #2563eb;
	border: 1px solid #d1d5db;
	padding: 12px 18px;
	color: #ffffff;
	font-size: 1.25rem;
	cursor: pointer;
	user-select: none;

}

.slide-switch input[type="radio"] {
	position: absolute;
	opacity: 0;
	width: 0;
	height: 0;
}

.slide-switch:has(input[type="radio"]:checked) {
	background-color: #ffffff;
	border: 1px solid #d1d5db;
	color: #2563eb;
}

.slide-switch:hover:not(:has(input[type="radio"]:checked)) {
	background-color: #5583fb;
	border: 1px solid #d1d5db;
	color: #ffffff;
}

.slide-add {
	background: #2563eb;
	border: 1px solid #d1d5db;
	padding: 12px 16px;
	border-radius: 24px;
	color: #ffffff;
	font-size: 1.25rem;
	cursor: pointer;
}

.slide-add:hover {
	background: #ffffff;
	border: 1px solid #d1d5db;
	color: #2563eb;
}


/* Toolbar styles */
.site-toolbar {
	background-color: #f3f4f6;
	padding: 8px 16px;
	display: flex;
	gap: 8px;
	border-bottom: 1px solid #e5e7eb;
	height: 30px;
}

.tool-btn {
	background-color: #ffffff;
	border: 1px solid #d1d5db;
    width: 100px;
	padding: 6px 12px;
	border-radius: 4px;
	cursor: pointer;
    z-index: 1;
}

.tool-btn:hover {
	background-color: #e5e7eb;
	display: block;
}
.drop-btn:hover {
	background-color: #e5e7eb;
}
.dropdown:hover .hidden {
	display: block;
}
.tool-btn:focus {
	background-color: #e0e2e9;
}

.hidden {
  display: none;
  position: absolute;
  background-color: #ffffff;
  min-width: 100px;
  box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
  z-index: 1;
  border-radius: 4px;
}

.drop-btn {
	background-color: #ffffff;
	border: 1px solid #d1d5db;
    width: 100px;
	padding: 6px 12px;
	border-radius: 4px;
	cursor: pointer;
    z-index: 1;
	display: block;
}

.scene {
	position: absolute;
	top: 120px; /* Match toolbar height */
	right: 5;
	width: calc(100vw - 15px);
	height: calc(100vh - 120px);
}

dialog {
	z-index: 1;
	position: absolute;
	right: 10;
	top: 112;
	margin-right: 8px;
	margin-top: 112px;
	border: none;
	background-color: #dddddd;
	box-shadow: -5px 5px 5px rgba(0, 0, 0, 0.2);
}

.form-element {
	line-height: 1.0;
	margin-bottom: 10px;
}
pre { tab-size: 4; }
</style>

<dialog id="Dialog">
	<form method="dialog" style="text-align: right;" id="dForm">
		<h1 id="dName" style="text-align: center;"> Element </h1>
		<div id="dURL" class="form-element">ModelURL	: <input type="url" style="width: 175px;" id="urlInput"/> <br> </div>
		<div id="dText" class="form-element">Text		: <input type="text" style="width: 175px;" id="textInput" /> <br> 
		Wrap Count	: <input type="number" style="width: 50px;" value="50" step="1" id="wrapCount" /> <br> </div>
		<div id="dCol" class="form-element">Color	: <input type="color"> </div>
		<div id="dPos" class="form-element">Position	: 
			<input type="number" style="width: 50px;" value="0" step="any" name="x" />
			<input type="number" style="width: 50px;" value="0" step="any" name="y" />
			<input type="number" style="width: 50px;" value="0" step="any" name="z" /> <br> </div>
		<div id="dRot" class="form-element">Rotation	: 
			<input type="number" style="width: 50px;" value="0" step="any" name="x" />
			<input type="number" style="width: 50px;" value="0" step="any" name="y" />
			<input type="number" style="width: 50px;" value="0" step="any" name="z" /> <br> </div>
		<div id="dSiz" class="form-element">Scale	:
			<input type="number" style="width: 50px;" value="1" step="any" name="x" />
			<input type="number" style="width: 50px;" value="1" step="any" name="y" />
			<input type="number" style="width: 50px;" value="1" step="any" name="z" /> <br> </div>
		<div id="dExit" class="form-element">
		<button type="button" id="okBtn" value="default" onClick="holo2elem();">ADD</button>
		<button id="exitBtn" onClick="closeEdit();">EXIT</button> </div>
	</form>
</dialog>

<!-- Will be used to switch slides -->
<div class="slide-banner">

	<label class="slide-switch"><input type="radio" name="slide" onclick="modelop = 2; modelEntity.setAttribute('gltf-model', '#model' + String(modelop));"> 2 </button></label>
	<label class="slide-switch"><input type="radio" name="slide" onclick="modelop = 3; modelEntity.setAttribute('gltf-model', '#model' + String(modelop));"> 3 </button></label>
	<label class="slide-switch"><input type="radio" name="slide" onclick="modelop = 4; modelEntity.setAttribute('gltf-model', '#model' + String(modelop));"> 4 </button></label>

</div>

	<head>
	<title>3D Model (glTF)</title>

	<body>
		<a-scene 
		cursor="rayOrigin: mouse"
		background="color: #ECECEC"
		embedded
		class="scene">
			<a-assets>
			<a-asset-item id="model1" src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/refs/heads/main/2.0/Avocado/glTF/Avocado.gltf"></a-asset-item>
			<a-asset-item id="model2" src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/refs/heads/main/2.0/AntiqueCamera/glTF/AntiqueCamera.gltf"></a-asset-item>
			<a-asset-item id="model3" src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/refs/heads/main/2.0/BarramundiFish/glTF/BarramundiFish.gltf"></a-asset-item>
			<a-asset-item id="model4" src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/refs/heads/main/2.0/BoomBox/glTF/BoomBox.gltf"></a-asset-item>
			</a-assets>
			<a-entity
			position="0 0 0"
			rotation="0 0 0"
			scale="0.5 0.5 0.5"
			gltf-model="#model1"
			></a-entity>
			<a-image
			src='https://raw.githubusercontent.com/Schnaz/AR_Test/refs/heads/main/pattern-Test.png'
			position="0 0 0"
			rotation="-90 0 0"
			width="1"
			height="1">
			</a-image>
			<a-plane
			id="xyplane"
			position="0 -0.01 0"
			rotation="-90 0 0"
			scale="5 5 5"
			color="#000000"
			material="opacity: 0.5; transparent: true;">
			</a-plane>
			<a-camera 
			wasd-controls="fly: false"
			position="0 2 5"
            rotation="0 0 -90">
			</a-camera>
		</a-scene>

<script>
let slides= [[], [], [], []];
let slide=0;
let item=0; //insert item
let mode=4; //tool mode: 0=insert, 1=position, 2=rotate, 3=scale, 4=view
const scene = document.querySelector('a-scene');
let modelop = 1;

const form = document.getElementById('dForm');

const dURL = document.getElementById('dURL');

const dCol = document.getElementById('dCol');
const dPos = document.getElementById('dPos');
const dRot = document.getElementById('dRot');
const dSiz = document.getElementById('dSiz');
const dExit = document.getElementById('dExit');

let elemlist=[];

function closeEdit() {
	for (const elem of document.querySelectorAll('.form-element')) {
		form.removeChild(elem);
	}
	hologram.remove();
	dialog.close();
}
(function() {
for (const elem of document.querySelectorAll('.form-element')) {
	form.removeChild(elem);
}

function holo2elem() {
	const clone = hologram.cloneNode(true);
	xyz = getValues(dPos);
	clone.setAttribute('position', { x: xyz[0], y: xyz[1], z: xyz[2] });
	xyz = getValues(dRot);
	clone.setAttribute('rotation', { x: xyz[0], y: xyz[1], z: xyz[2] });
	xyz = getValues(dSiz);
	clone.setAttribute('scale', { x: xyz[0], y: xyz[1], z: xyz[2] });
	scene.append(clone);
	slides[slide].push(clone);
}

function elem2holo() { //TODO this needs to be set up to do the reverse
	const clone = hologram.cloneNode(true);
	xyz = getValues(dPos);
	clone.setAttribute('position', { x: xyz[0], y: xyz[1], z: xyz[2] });
	xyz = getValues(dRot);
	clone.setAttribute('rotation', { x: xyz[0], y: xyz[1], z: xyz[2] });
	xyz = getValues(dSiz);
	clone.setAttribute('scale', { x: xyz[0], y: xyz[1], z: xyz[2] });
	scene.append(clone);
	slides[slide].push(clone);
}

function newEdit(type) {
	if (dialog.open) closeEdit();
	hologram = document.createElement(type);
	switch (type) {
		case "a-text":
		dName.textContent = "Text"
		elemlist = [dText, dCol, dPos, dRot, dSiz, dExit];
		hologram.setAttribute('align', 'center');
		break;
		case "a-gltf-model":
		dName.textContent = "Model"
		elemlist = [dURL, dCol, dPos, dRot, dSiz, dExit];
		break;
		case "a-box":
		dName.textContent = "Box"
		elemlist = [dPos, dCol, dRot, dSiz, dExit];
		break;
	}
	//possibly put reinitialization code here
	form.append(...elemlist);
	dialog.show();
	
	scene.append(hologram);
	xyz = getValues(dPos);
	hologram.setAttribute('position', { x: xyz[0], y: xyz[1], z: xyz[2] });
	xyz = getValues(dRot);
	hologram.setAttribute('rotation', { x: xyz[0], y: xyz[1], z: xyz[2] });
	xyz = getValues(dSiz);
	hologram.setAttribute('scale', { x: xyz[0], y: xyz[1], z: xyz[2] });
	xyz = getValues(dCol);
	hologram.setAttribute('color', xyz[0]);
	hologram.setAttribute('material', { opacity: 0.5, transparent: true })
	//el.setAttribute('material', 'color', 'red');
}

function getValues(elem) {

	//return values = Array.from(elem.querySelectorAll('input')).map(input => input.value);
	return Array.from(elem.querySelectorAll('input'), input => input.value);
}

dialog.addEventListener('input', (event) => {
	let xyz = [];
	switch(event.target.parentElement) {
		case dText:
			xyz = getValues(dText);
			hologram.setAttribute('value', xyz[0]);
			hologram.setAttribute('wrap-count', xyz[1]);
		break;
		case dURL:
			xyz = getValues(dURL);
			hologram.setAttribute('src', xyz[0]);
			//hologram.setAttribute('wrapCount', xyz[1]);
		break;
		case dPos:
			xyz = getValues(dPos);
			hologram.setAttribute('position', { x: xyz[0], y: xyz[1], z: xyz[2] });
		break;
		case dRot:
			xyz = getValues(dRot);
			hologram.setAttribute('rotation', { x: xyz[0], y: xyz[1], z: xyz[2] });
		break;
		case dSiz:
			xyz = getValues(dSiz);
			hologram.setAttribute('scale', { x: xyz[0], y: xyz[1], z: xyz[2] });
		break;
		case dCol:
			xyz = getValues(dCol);
			hologram.setAttribute('color', xyz[0]);
		break;
	}
		//xyz = getValues(dPos);
		//hologram.setAttribute('position', { x: xyz[0], y: xyz[1], z: xyz[2] });
		//xyz = getValues(dRot);
		//hologram.setAttribute('rotation', { x: xyz[0], y: xyz[1], z: xyz[2] });
		//xyz = getValues(dSiz);
		//hologram.setAttribute('scale', { x: xyz[0], y: xyz[1], z: xyz[2] });
});

function askUser() {
  return new Promise((resolve) => {
    dialog.showModal();
    dialog.onclose = () => resolve(input.value);
  });
}

async function insertEntity(x, y, z, type) {
switch(type) {
	case 0: //undefined
	break;
	case 1: //text
		model = document.createElement('a-text');
		value = await askUser();
		model.setAttribute('value', value);
		model.setAttribute('position', { x: x, y: y, z: z });
		model.setAttribute('scale', { x: 0.1, y: 1, z: 1 });
		model.setAttribute('rotation', { x: -90, y: 0, z: 0 });
		model.setAttribute('color', '#000000');
		slides[slide].push([type, x, y, z, 1, 1, 1, 0, 0, 0, value]);
		scene.append(model);

	break;
	case 2: //model
		model = document.createElement('a-gltf-model');
		value = await askUser();
		model.setAttribute('src', value);
		model.setAttribute('position', { x: x, y: y, z: z });
		model.setAttribute('scale', { x: 1, y: 1, z: 1 });
		slides[slide].push([type, x, y, z, 1, 1, 1, 0, 0, 0, value]);
		scene.append(model);
	break;
	case 3: //arrows
	break;
	case 4: //box
	break;
}
mode = 4;
}

document.addEventListener('keydown', function(event) {
	if (event.code === 'Minus') {
		if (modelop>1) modelop-=1;
		modelEntity.setAttribute('gltf-model', "#model" + String(modelop));

});
document.addEventListener('keydown', function(event) {
	if (event.code === 'Equal') {
